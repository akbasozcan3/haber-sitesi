<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250" fill="none">
  <defs>
    <linearGradient id="bg_rect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btn_rect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow_rect" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="250" rx="8" fill="url(#bg_rect)"/>
  <circle cx="150" cy="90" r="90" fill="url(#glow_rect)"/>
  <rect x="0.5" y="0.5" width="299" height="249" rx="7.5" stroke="#334155" stroke-opacity="0.8"/>

  <!-- Üst Logo / Rozet -->
  <g transform="translate(20, 20)">
    <rect width="32" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M16 8L23 12V20L16 24L9 20V12L16 8Z" stroke="#38bdf8" stroke-width="1.5" fill="#0284c7" fill-opacity="0.3"/>
    <text x="42" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">AWS ENTERPRISE</text>
    <text x="42" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Bulut & Yapay Zeka Altyapısı</text>
  </g>

  <!-- Başlık -->
  <text x="20" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">
    Yüksek Performanslı
  </text>
  <text x="20" y="107" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">
    Bulut Sunucuları
  </text>

  <!-- Açıklama -->
  <text x="20" y="135" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">
    %99.99 erişilebilirlik, NVMe Gen4 diskler
  </text>
  <text x="20" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">
    ve sınırsız bant genişliği ile başlayın.
  </text>

  <!-- Kampanya Metni -->
  <g transform="translate(20, 168)">
    <rect width="120" height="20" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="60" y="14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">İLK AY %50 İNDİRİM</text>
  </g>

  <!-- CTA Buton -->
  <g transform="translate(20, 198)">
    <rect width="260" height="36" rx="6" fill="url(#btn_rect)"/>
    <text x="130" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hemen İncele ➔</text>
  </g>
</svg>
