  </g>

  <!-- CTA Buton -->
  <g transform="translate(18, 510)">
    <rect width="124" height="40" rx="8" fill="url(#btn_sky)"/>
    <text x="62" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Şimdi İncele ➔</text>
