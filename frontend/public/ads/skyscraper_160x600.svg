<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" fill="none">
  <defs>
    <linearGradient id="bg_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btn_sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow_sky" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="160" height="600" rx="8" fill="url(#bg_sky)"/>
  <circle cx="80" cy="180" r="90" fill="url(#glow_sky)"/>
  <rect x="0.5" y="0.5" width="159" height="599" rx="7.5" stroke="#334155" stroke-opacity="0.8"/>

  <!-- Logo İkonu -->
  <g transform="translate(60, 30)">
    <rect width="40" height="40" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <path d="M20 10L30 15V25L20 30L10 25V15L20 10Z" stroke="#60a5fa" stroke-width="2" fill="#3b82f6" fill-opacity="0.3"/>
  </g>

  <!-- Marka Adı -->
  <text x="80" y="95" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">CLOUD PRO</text>

  <!-- Başlık -->
  <text x="80" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Yeni Nesil</text>
  <text x="80" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Bulut Sunucu</text>

  <!-- Çizgi -->
  <line x1="25" y1="175" x2="135" y2="175" stroke="#374151" stroke-width="1"/>

  <!-- Özellik Maddeleri -->
  <g transform="translate(20, 200)">
    <circle cx="6" cy="6" r="5" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="2.5" fill="#10b981"/>
    <text x="18" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">NVMe Gen4 SSD</text>
  </g>

  <g transform="translate(20, 235)">
    <circle cx="6" cy="6" r="5" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="2.5" fill="#10b981"/>
    <text x="18" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">10 Gbps Port</text>
  </g>

  <g transform="translate(20, 270)">
    <circle cx="6" cy="6" r="5" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="2.5" fill="#10b981"/>
    <text x="18" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DDoS Koruma</text>
  </g>

  <g transform="translate(20, 305)">
    <circle cx="6" cy="6" r="5" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="2.5" fill="#10b981"/>
    <text x="18" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">7/24 Destek</text>
  </g>

